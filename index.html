<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wizard Runner</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; touch-action: none; background: #38bdf8; }
    canvas { display: block; }
    #mic-btn {
      position: fixed;
      bottom: 60px; left: 50%;
      transform: translateX(-50%);
      padding: 14px 30px;
      font-size: 18px; font-weight: bold; font-family: monospace;
      background: #fbbf24; color: #111;
      border: none; border-radius: 10px; cursor: pointer;
      z-index: 200;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    #mic-status {
      position: fixed;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      color: #fff; font-size: 14px; font-family: monospace;
      z-index: 200;
      text-shadow: 1px 1px 3px #000;
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<button id="mic-btn">🎤 Enable Mic Jump</button>
<div id="mic-status"></div>

<script>
"use strict";

// ─── Canvas Setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const W  = () => canvas.width;
const H  = () => canvas.height;
const GY = () => canvas.height - 80;   // ground top Y

const PLAYER_X = 130;
const BASE_SPD = 280;
const GRAVITY  = 1900;
const HS_KEY   = "wzr_hs_v1";

function getHS()   { return parseInt(localStorage.getItem(HS_KEY) || "0"); }
function saveHS(s) { if (s > getHS()) localStorage.setItem(HS_KEY, String(s)); }

// ─── Web Audio ────────────────────────────────────────────────────────────────
let _audioCtx   = null;
let _analyser   = null;
let micActive   = false;
let micCooldown = false;

function getACtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}

function sfx(kind) {
  try {
    const ac = getACtx(), osc = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    osc.connect(g); g.connect(ac.destination);
    switch (kind) {
      case "jump":
        osc.type = "sine";
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(520, t + 0.13);
        g.gain.setValueAtTime(0.22, t); g.gain.linearRampToValueAtTime(0, t + 0.17);
        osc.start(t); osc.stop(t + 0.17); break;
      case "coin":
        osc.type = "triangle";
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(1320, t + 0.07);
        g.gain.setValueAtTime(0.28, t); g.gain.linearRampToValueAtTime(0, t + 0.11);
        osc.start(t); osc.stop(t + 0.11); break;
      case "die":
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.55);
        g.gain.setValueAtTime(0.30, t); g.gain.linearRampToValueAtTime(0, t + 0.65);
        osc.start(t); osc.stop(t + 0.65); break;
    }
  } catch(_) {}
}

async function enableMic() {
  try {
    const ac     = getACtx();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const src    = ac.createMediaStreamSource(stream);
    _analyser    = ac.createAnalyser();
    _analyser.fftSize = 512;
    src.connect(_analyser);
    micActive = true;
    document.getElementById("mic-status").textContent = "🎤 Active — Clap / shout to jump!";
    const btn = document.getElementById("mic-btn");
    btn.textContent = "✅ Mic Enabled";
    btn.style.background = "#4ade80";
  } catch(_) {
    document.getElementById("mic-status").textContent = "❌ Mic denied — use Space / Tap";
  }
}

function getMicVol() {
  if (!_analyser) return 0;
  const buf = new Uint8Array(_analyser.frequencyBinCount);
  _analyser.getByteTimeDomainData(buf);
  let rms = 0;
  for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; rms += v * v; }
  return Math.sqrt(rms / buf.length);
}

document.getElementById("mic-btn").addEventListener("click", e => {
  e.stopPropagation();
  enableMic();
});

// ─── Game State ───────────────────────────────────────────────────────────────
let scene    = "menu";   // "menu" | "game" | "gameover"
let lastTime = 0;

// Player
let playerY  = 0;
let playerVY = 0;
let grounded = false;

// Entities
let enemies   = [];
let coins     = [];
let clouds    = [];
let tufts     = [];

// Game vars
let score      = 0;
let elapsed    = 0;
let spd        = BASE_SPD;
let alive      = true;
let deathTimer = 0;
let lastScore  = 0;

// Spawn timers
let enemyTimer = 0, nextEnemyTime = 2;
let coinTimer  = 0, nextCoinTime  = 1.2;
let cloudTimer = 0, nextCloudTime = 2.5;

function initGame() {
  playerY  = GY() - 4;
  playerVY = 0;
  grounded = true;
  enemies  = [];
  coins    = [];
  clouds   = [
    { x: W() * 0.3, y: 55,  size: 50 },
    { x: W() * 0.7, y: 85,  size: 38 },
  ];
  tufts = [];
  for (let i = 0; i < 10; i++) tufts.push({ x: i * (W() / 9) });

  score      = 0;
  elapsed    = 0;
  spd        = BASE_SPD;
  alive      = true;
  deathTimer = 0;

  enemyTimer    = 0; nextEnemyTime = 1.6 + Math.random() * 1.6;
  coinTimer     = 0; nextCoinTime  = 0.9 + Math.random() * 1.2;
  cloudTimer    = 0; nextCloudTime = 2.5;
}

// ─── Input ────────────────────────────────────────────────────────────────────
function doJump() {
  if (!alive) return;
  if (grounded) {
    playerVY = -790;
    sfx("jump");
  }
}

function handleStart() {
  initGame();
  scene = "game";
  document.getElementById("mic-btn").style.display = "none";
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (scene === "game") doJump();
    else handleStart();
  }
});

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (scene === "game") doJump();
  else handleStart();
}, { passive: false });

// ─── Drawing Helpers ──────────────────────────────────────────────────────────
function emoji(em, x, y, size) {
  ctx.save();
  ctx.font         = size + "px serif";
  ctx.textAlign    = "center";
  ctx.textBaseline = "bottom";
  ctx.fillText(em, x, y);
  ctx.restore();
}

function label(text, x, y, size, color, align) {
  ctx.save();
  ctx.font         = "bold " + size + "px monospace";
  ctx.fillStyle    = color;
  ctx.textAlign    = align || "center";
  ctx.textBaseline = "top";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawSky() {
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(0, 0, W(), H());
}

function drawGround() {
  const gy = GY();
  ctx.fillStyle = "#4ade80";
  ctx.fillRect(0, gy, W(), H() - gy);
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(0, gy, W(), 8);
}

function drawHills(offsets) {
  const gy  = GY();
  const hc  = [[167,243,208],[134,239,172],[74,222,128]];
  const xs  = offsets || [90, 320, 550, 780];
  for (let i = 0; i < xs.length; i++) {
    const c = hc[i % hc.length];
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath();
    ctx.arc(xs[i], gy - 4, 55 + i * 10, 0, Math.PI);
    ctx.fill();
  }
}

// AABB collision
function hits(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ─── Game Update ──────────────────────────────────────────────────────────────
function gameUpdate(dt) {
  if (!alive) {
    deathTimer += dt;
    if (deathTimer >= 0.7) {
      lastScore = score;
      saveHS(Math.floor(score));
      scene = "gameover";
      document.getElementById("mic-btn").style.display = "block";
    }
    return;
  }

  elapsed += dt;
  spd      = BASE_SPD + elapsed * 22;
  score   += dt * 6;

  // Mic
  if (micActive && !micCooldown && getMicVol() > 0.16) {
    doJump();
    micCooldown = true;
    setTimeout(() => { micCooldown = false; }, 650);
  }

  // Player physics
  playerVY += GRAVITY * dt;
  playerY  += playerVY * dt;
  const floor = GY() - 4;
  if (playerY >= floor) {
    playerY  = floor;
    playerVY = 0;
    grounded = true;
  } else {
    grounded = false;
  }

  // Clouds
  cloudTimer += dt;
  if (cloudTimer >= nextCloudTime) {
    cloudTimer    = 0;
    nextCloudTime = 2 + Math.random() * 2;
    clouds.push({ x: W() + 80, y: 20 + Math.random() * (GY() - 190), size: 28 + Math.random() * 44 });
  }
  for (const c of clouds) c.x -= c.size * 0.6 * dt;
  clouds = clouds.filter(c => c.x > -160);

  // Tufts
  for (const t of tufts) {
    t.x -= spd * dt;
    if (t.x < -16) t.x += W() + 32;
  }

  // Enemies
  enemyTimer += dt;
  if (enemyTimer >= nextEnemyTime) {
    enemyTimer    = 0;
    nextEnemyTime = 1.4 + Math.random() * 1.8;
    const isShroom = Math.random() < 0.5;
    enemies.push({ emoji: isShroom ? "🍄" : "🐢", size: isShroom ? 44 : 50,
                   x: W() + 80, y: GY() - 4 });
  }
  for (const e of enemies) e.x -= spd * dt;
  enemies = enemies.filter(e => e.x > -110);

  // Coins
  coinTimer += dt;
  if (coinTimer >= nextCoinTime) {
    coinTimer    = 0;
    nextCoinTime = 0.9 + Math.random() * 1.2;
    coins.push({ x: W() + 60, y: GY() - 90 - Math.random() * 130 });
  }
  for (const c of coins) c.x -= spd * dt;
  coins = coins.filter(c => c.x > -90);

  // Player hitbox (tight inner box for fairness)
  const pw = 36, ph = 50;
  const px = PLAYER_X - pw / 2;
  const py = playerY  - ph;

  // Enemy collision
  for (const e of enemies) {
    const ew = e.size * 0.68, eh = e.size * 0.82;
    if (hits(px + 6, py + 8, pw - 12, ph - 10,
             e.x - ew / 2, e.y - eh, ew, eh)) {
      alive = false;
      sfx("die");
      break;
    }
  }

  // Coin collection
  coins = coins.filter(c => {
    const cw = 28, ch = 28;
    if (hits(px, py, pw, ph, c.x - cw/2, c.y - ch/2, cw, ch)) {
      score += 10;
      sfx("coin");
      return false;
    }
    return true;
  });
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderGame() {
  drawSky();
  for (const c of clouds) emoji("☁️", c.x, c.y + c.size * 0.6, c.size);
  drawHills();
  drawGround();

  // Tufts
  ctx.fillStyle = "#16a34a";
  for (const t of tufts) ctx.fillRect(t.x, GY() - 14, 8, 20);

  for (const c of coins)    emoji("🪙", c.x, c.y + 17, 34);
  for (const e of enemies)  emoji(e.emoji, e.x, e.y, e.size);

  // Player (flicker when dead)
  if (alive || Math.floor(deathTimer * 10) % 2 === 0) {
    emoji("🧙", PLAYER_X, playerY, 60);
  }

  // HUD
  label("Score: " + Math.floor(score), 16, 16, 28, "#fff", "left");
  label("Best: "  + getHS(),           16, 52, 20, "#ffd700", "left");
  label("SPACE / Tap = Jump", W() - 16, 16, 15, "#d2ffd2", "right");
}

function hillXs(n, screenW) {
  const step = screenW / (n - 1);
  return Array.from({ length: n }, (_, i) => 80 + i * step * 0.85);
}

function renderMenu() {
  drawSky();
  drawHills(hillXs(5, W()));
  drawGround();

  const cx = W() / 2, cy = H() / 2;
  emoji("🧙", cx, cy - 88, 92);

  const titleSz = Math.min(50, W() / 12);
  label("WIZARD  RUNNER", cx, cy - 42, titleSz, "#fff");
  label("Avoid  🍄  🐢     Collect  🪙", cx, cy + 22, 18, "#f0f050");
  label("High Score: " + getHS(), cx, cy + 62, 22, "#ffd700");
  label("▶  TAP  or  SPACE  to  Start",  cx, cy + 106, 19, "#fff");
}

function renderGameOver() {
  drawSky();
  drawHills(hillXs(5, W()));
  drawGround();

  const cx = W() / 2, cy = H() / 2;
  emoji("🧙", cx, cy - 88, 76);

  const goSz = Math.min(60, W() / 10);
  label("GAME  OVER",   cx, cy - 54, goSz, "#ff4646");
  label("Score: " + Math.floor(lastScore), cx, cy + 12, 38, "#fff");
  const hs = getHS();
  label("Best:  " + hs, cx, cy + 62, 28, "#ffd700");
  if (Math.floor(lastScore) >= hs && lastScore > 0) {
    label("🏆  NEW  RECORD!", cx, cy + 108, 24, "#ffdf00");
  }
  label("Tap  or  SPACE  to  Play  Again", cx, cy + 158, 20, "#f0f050");
}

// ─── Main Loop ────────────────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (scene === "game") gameUpdate(dt);

  ctx.clearRect(0, 0, W(), H());
  if      (scene === "menu")     renderMenu();
  else if (scene === "game")     renderGame();
  else if (scene === "gameover") renderGameOver();

  requestAnimationFrame(loop);
}

scene = "menu";
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
